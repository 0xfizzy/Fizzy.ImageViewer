name: Release readiness
description: Record release validation and publication configuration before creating a release tag.
title: 'release: readiness for v'
body:
  - type: input
    id: version
    attributes:
      label: Version and reviewed commit
      placeholder: v1.2.0 / full commit SHA
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Validation evidence
      description: Link CI runs and applicable local validation results, including offline failure and recovery gates.
    validations:
      required: true
  - type: checkboxes
    id: checks
    attributes:
      label: Release review
      options:
        - label: Full release gate and workflow checks passed at the reviewed commit.
        - label: English and Chinese guides, API reference, examples and fixed package documentation links were reviewed.
        - label: Pages, archive permissions and NuGet OIDC configuration were verified in the intended environment.
        - label: Required interaction, performance and consumer checks were completed or limitations recorded below.
        - label: The original bundle retention and prohibition on moving tags/overwriting historical versions are understood.
  - type: textarea
    id: limitations
    attributes:
      label: Unverified scenarios and remaining actions
      description: List incomplete required checks and remaining publication actions. Tag creation is a separate authorized publication action.
    validations:
      required: true
