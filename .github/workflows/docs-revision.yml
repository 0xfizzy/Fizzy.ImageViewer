name: Documentation revision
on:
  workflow_dispatch:
    inputs:
      action:
        type: choice
        options: [start, resume, rollback]
        required: true
      version:
        type: string
        required: true
      revision:
        type: string
        required: true
      source_ref:
        type: string
        description: Committed documentation branch or SHA (start only)
permissions:
  contents: read
jobs:
  prepare:
    if: github.ref == 'refs/heads/main' && inputs.action == 'start'
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source_ref }}
          path: artifacts/source
          fetch-depth: 0
      - name: Reject runtime and tooling changes before executing candidate scripts
        shell: pwsh
        env:
          VERSION: ${{ inputs.version }}
        run: ./scripts/Documentation-Revision.ps1 -Action ValidateSource -Version $env:VERSION -Source artifacts/source
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: artifacts/source/global.json
      - uses: actions/setup-node@v4
        with:
          node-version: '22.14.0'
      - run: npm ci
        working-directory: artifacts/source
      - run: npx playwright install chromium
        working-directory: artifacts/source
      - name: Validate correction against original package
        working-directory: artifacts/source
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ inputs.version }}
          REVISION: ${{ inputs.revision }}
        run: ./scripts/Documentation-Revision.ps1 -Action Check -Version $env:VERSION -Revision $env:REVISION
      - uses: actions/upload-artifact@v4
        with:
          name: revision-bundle
          path: artifacts/source/artifacts/revision-bundle
          if-no-files-found: error
  deploy:
    if: always() && github.ref == 'refs/heads/main' && (needs.prepare.result == 'success' || (needs.prepare.result == 'skipped' && inputs.action != 'start'))
    needs: prepare
    runs-on: windows-2022
    concurrency:
      group: documentation-publication
      cancel-in-progress: false
    environment: github-pages
    permissions:
      contents: write
      pages: write
      id-token: write
    env:
      GH_TOKEN: ${{ github.token }}
      VERSION: ${{ inputs.version }}
      REVISION: ${{ inputs.revision }}
    steps:
      - uses: actions/checkout@v4
      - id: config
        shell: pwsh
        run: |
          $config = Get-Content docs/site.json -Raw | ConvertFrom-Json
          "archive=$($config.archiveBranch)" >> $env:GITHUB_OUTPUT
      - uses: actions/checkout@v4
        with:
          ref: ${{ steps.config.outputs.archive }}
          path: artifacts/archive
          fetch-depth: 0
      - uses: actions/download-artifact@v4
        if: inputs.action == 'start'
        with:
          name: revision-bundle
          path: artifacts/revision-bundle
      - name: Persist original revision bundle and stage immutable site
        if: inputs.action != 'rollback'
        shell: pwsh
        run: |
          ./scripts/Documentation-Revision.ps1 -Action Stage -Version $env:VERSION -Revision $env:REVISION
          ./scripts/Save-DocumentationArchive.ps1 -Archive artifacts/archive -Message 'docs: archive immutable correction'
      - uses: ./.github/actions/deploy-archive
        if: inputs.action != 'rollback'
        with:
          stage: revision
      - name: Verify fixed revision before activating
        shell: pwsh
        env:
          REVISION_ACTION: ${{ inputs.action }}
        run: |
          if ($env:REVISION_ACTION -eq 'rollback') {
            ./scripts/Documentation-Revision.ps1 -Action Verify -Version $env:VERSION -Revision $env:REVISION
            ./scripts/Merge-DocumentationArchive.ps1 -Archive artifacts/archive -Version $env:VERSION -Revision $env:REVISION -Activate
          } else {
            ./scripts/Documentation-Revision.ps1 -Action Activate -Version $env:VERSION -Revision $env:REVISION
          }
          ./scripts/Save-DocumentationArchive.ps1 -Archive artifacts/archive -Message 'docs: activate verified correction'
      - uses: ./.github/actions/deploy-archive
        with:
          stage: active-revision
      - name: Verify active entrypoints
        shell: pwsh
        run: ./scripts/Documentation-Revision.ps1 -Action Verify -Version $env:VERSION -Revision $env:REVISION -RequireActive
