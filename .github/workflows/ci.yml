name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - name: Restore library
        run: dotnet restore Fizzy.ImageViewer.csproj
      - name: Restore tests
        run: dotnet restore tests/Fizzy.ImageViewer.Tests/Fizzy.ImageViewer.Tests.csproj
      - name: Restore frame benchmark
        run: dotnet restore tools/FrameBenchmark/FrameBenchmark.csproj
      - name: Restore drawing benchmark
        run: dotnet restore tools/DrawingBenchmark/DrawingBenchmark.csproj
      - name: Build library
        run: dotnet build Fizzy.ImageViewer.csproj -c Release --no-restore
      - name: Test library
        run: dotnet test tests/Fizzy.ImageViewer.Tests/Fizzy.ImageViewer.Tests.csproj -c Release --no-restore
      - name: Build frame benchmark
        run: dotnet build tools/FrameBenchmark/FrameBenchmark.csproj -c Release --no-restore
      - name: Build drawing benchmark
        run: dotnet build tools/DrawingBenchmark/DrawingBenchmark.csproj -c Release --no-restore
      - name: Pack
        run: dotnet pack Fizzy.ImageViewer.csproj -c Release --no-restore -o artifacts/ci
