name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - name: Restore library
        run: dotnet restore Fizzy.ImageViewer.csproj
      - name: Restore tests
        run: dotnet restore tests/Fizzy.ImageViewer.Tests/Fizzy.ImageViewer.Tests.csproj
      - name: Restore frame benchmark
        run: dotnet restore tools/FrameBenchmark/FrameBenchmark.csproj
      - name: Restore drawing benchmark
        run: dotnet restore tools/DrawingBenchmark/DrawingBenchmark.csproj
      - name: Restore resize benchmark
        run: dotnet restore tools/ResizeBenchmark/ResizeBenchmark.csproj
      - name: Build library
        run: dotnet build Fizzy.ImageViewer.csproj -c Release --no-restore
      - name: Test library
        run: dotnet test tests/Fizzy.ImageViewer.Tests/Fizzy.ImageViewer.Tests.csproj -c Release --no-restore
      - name: Build frame benchmark
        run: dotnet build tools/FrameBenchmark/FrameBenchmark.csproj -c Release --no-restore
      - name: Build drawing benchmark
        run: dotnet build tools/DrawingBenchmark/DrawingBenchmark.csproj -c Release --no-restore
      - name: Build resize benchmark
        run: dotnet build tools/ResizeBenchmark/ResizeBenchmark.csproj -c Release --no-restore
      - name: Build line-profile benchmark
        run: dotnet build tools/LineProfileBenchmark/LineProfileBenchmark.csproj -c Release
      - name: Pack
        run: dotnet pack Fizzy.ImageViewer.csproj -c Release --no-restore -o artifacts/ci
      - name: Verify packaged XML contracts
        shell: pwsh
        run: |
          $package = @(Get-ChildItem artifacts/ci -Filter Fizzy.ImageViewer.*.nupkg)
          if ($package.Count -ne 1) { throw 'Expected one package.' }
          $archive = [System.IO.Compression.ZipFile]::OpenRead($package[0].FullName)
          try {
            $entry = $archive.GetEntry('lib/net8.0-windows7.0/Fizzy.ImageViewer.xml')
            if ($null -eq $entry) { throw 'The package must include IntelliSense XML documentation.' }
            $reader = [System.IO.StreamReader]::new($entry.Open())
            try { [xml]$documentation = $reader.ReadToEnd() } finally { $reader.Dispose() }
            $members = @($documentation.doc.members.member)
            $ownership = @($members | Where-Object { $_.name -like 'M:Fizzy.ImageViewer.Frames.ImageFrame.TakeOwnership(*' })
            if ($ownership.Count -ne 1 -or $ownership[0].SelectSingleNode('summary').InnerText -notmatch 'Transfers ownership') {
              throw 'The transferred frame ownership contract is missing.'
            }
            $provider = $members | Where-Object { $_.name -eq 'T:Fizzy.ImageViewer.Frames.IFramePixelSource' }
            if ($null -eq $provider -or $provider.SelectSingleNode('remarks').InnerText -notmatch 'concurrently') {
              throw 'The pixel provider concurrency contract is missing.'
            }
          } finally { $archive.Dispose() }
